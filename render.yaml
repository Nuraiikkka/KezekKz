databases:
  - name: kezek-db
    plan: free
    databaseName: kezek

services:
  - type: web
    name: kezek-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_demo && python manage.py set_telegram_webhook && gunicorn settings.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /api/clinics/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings.env.prod
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: kezek-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_PASSWORD
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: kezek-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kezek-api-gdnj.onrender.com/api
      - key: NODE_VERSION
        value: 20.18.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
